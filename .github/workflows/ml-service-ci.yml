name: ml-service CI

on:
  push:
    branches: [main]
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
  pull_request:
    paths:
      - "ml-service/**"
      - ".github/workflows/ml-service-ci.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: utf-8

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,runtime-model]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -v
