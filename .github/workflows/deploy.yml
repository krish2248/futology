name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt into Node 24 for JavaScript actions ahead of the September 2026
  # Node 20 sunset on GitHub Actions runners.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futology
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: futology/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build:export
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: /futology
          NEXT_PUBLIC_APP_URL: https://krish2248.github.io/futology
          NEXT_PUBLIC_APP_NAME: FUTOLOGY
          # Supabase publishable values — safe to inline (designed to
          # live in the browser bundle). Rotate via the Supabase
          # dashboard and edit this file if the project ever moves.
          NEXT_PUBLIC_SUPABASE_URL: https://zlivysbodcgmalycetfr.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hcHSeaKUHpy2Bh8SvtK1-A_2ckiiuAC
          # ML service URL + token — set via GitHub Actions repo
          # secrets once the Hugging Face Space is deployed. Empty
          # values fall back to the in-bundle synthetic predictors,
          # so the live site keeps working before the secrets exist.
          NEXT_PUBLIC_ML_API_URL: ${{ secrets.NEXT_PUBLIC_ML_API_URL }}
          NEXT_PUBLIC_ML_API_TOKEN: ${{ secrets.NEXT_PUBLIC_ML_API_TOKEN }}

      - name: Add .nojekyll (defense in depth)
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: futology/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
