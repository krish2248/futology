[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futology-ml"
version = "0.1.0"
description = "FUTOLOGY ML microservice — match prediction, player clustering, sentiment, transfer values."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sonik Krish", email = "sonikrish2248@gmail.com" }]

# Stub-stage dependencies. XGBoost / scikit-learn / pandas / SHAP land in
# v0.2 once the first real model trains. Keeping the boot image small until
# then so Railway cold-starts stay fast.
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
