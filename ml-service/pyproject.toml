[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futology-ml"
version = "0.1.0"
description = "FUTOLOGY ML microservice — match prediction, player clustering, sentiment, transfer values."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sonik Krish", email = "sonikrish2248@gmail.com" }]

# Stub-stage dependencies. XGBoost / scikit-learn / pandas / SHAP land in
# v0.2 once the first real model trains. Keeping the boot image small until
# then so Railway cold-starts stay fast.
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]
# `train` is opt-in so the Railway runtime image stays slim. The trained
# model itself is loaded via joblib at runtime (which is in the base
# install), but fitting it requires the heavy stack below.
train = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "joblib>=1.4,<2",
    "requests>=2.32,<3",
    "shap>=0.46,<1",
    "pulp>=2.9,<4",
]
# Runtime needs joblib to deserialize the pickle. Pulled into base
# rather than `train` so Railway can load the model without the rest.
runtime-model = [
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "shap>=0.46,<1",
    "pulp>=2.9,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
